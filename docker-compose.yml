services:
  # FastMCP Memory Server
  mnesia-mcp:
    build: .
    container_name: mnesia-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    env_file:
      - .env

  # Optional Cloudflare Tunnel sidecar:
  # Exposes the MCP server to Cloudflare's Edge (https://mcp.yourdomain.com)
  # without opening inbound ports or setting up certbot.
  # Get tunnel token from: Cloudflare Dashboard -> Zero Trust -> Networks -> Tunnels
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mnesia-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - mnesia-mcp
    profiles:
      - cloudflare
